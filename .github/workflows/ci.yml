name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build -trimpath -o build/oneocr.exe ./cmd/oneocr

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneocr-windows-amd64
          path: build/oneocr.exe
          if-no-files-found: error
